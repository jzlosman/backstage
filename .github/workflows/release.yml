name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed universal app
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-universal-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version." >&2
            exit 1
          fi

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Check types
        run: pnpm typecheck

      - name: Check release configuration
        run: pnpm check:release-config

      - name: Validate OpenSpec
        run: pnpm exec openspec validate --all --strict

      - name: Build production code
        run: pnpm build

      - name: Prepare Apple credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain_path="$RUNNER_TEMP/backstage-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/backstage-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password="$(openssl rand -hex 32)"

          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          certificate_info="$(security find-identity -v -p codesigning "$keychain_path" | grep 'Developer ID Application' | head -1)"
          signing_identity="$(printf '%s' "$certificate_info" | awk -F'"' '{print $2}')"
          [[ -n "$signing_identity" ]] || {
            echo 'No Developer ID Application identity was imported.' >&2
            exit 1
          }

          {
            echo "APPLE_API_KEY_PATH=$api_key_path"
            echo "APPLE_SIGNING_IDENTITY=$signing_identity"
          } >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify and stage release assets
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          bundle_root="target/universal-apple-darwin/release/bundle"
          app_path="$bundle_root/macos/Backstage.app"
          executable="$app_path/Contents/MacOS/backstage-app"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          [[ -d "$app_path" ]] || {
            echo "Missing app bundle at $app_path" >&2
            exit 1
          }
          [[ -n "$dmg_path" && -f "$dmg_path" ]] || {
            echo "Missing DMG below $bundle_root/dmg" >&2
            exit 1
          }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep 'Authority=Developer ID Application'
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

          architectures="$(lipo -archs "$executable")"
          grep -qw arm64 <<< "$architectures"
          grep -qw x86_64 <<< "$architectures"

          mkdir -p dist
          cp "$dmg_path" "dist/Backstage_${version}_universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "dist/Backstage_${version}_universal.app.zip"
          (
            cd dist
            shasum -a 256 \
              "Backstage_${version}_universal.dmg" \
              "Backstage_${version}_universal.app.zip" > SHA256SUMS.txt
          )

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Backstage-${{ github.sha }}-macOS-universal
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish pre-release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          [[ -f "$notes_file" ]] || {
            echo "Missing release notes at $notes_file" >&2
            exit 1
          }

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists." >&2
            exit 1
          fi

          cleanup_partial_release() {
            status=$?
            trap - EXIT
            if [[ $status -ne 0 ]]; then
              gh release delete "$GITHUB_REF_NAME" --yes >/dev/null 2>&1 || true
            fi
            exit $status
          }
          trap cleanup_partial_release EXIT

          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Backstage $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            --prerelease \
            --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=true
          trap - EXIT

      - name: Remove Apple credentials
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/backstage-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/backstage-certificate.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
